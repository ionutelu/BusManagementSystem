# Test datasource ? H2 in-memory (overrides main application.properties)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2Dialect is auto-detected; no need to specify it explicitly
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Suppress SQL debug logging that leaks in from the active dev profile
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# JWT stub values for test context
jwt.secret=test-secret-key-for-unit-tests-only!!
jwt.expiration-ms=3600000



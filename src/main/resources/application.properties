spring.application.name=${APP_NAME:Busstation}

# Default to dev profile locally; override via SPRING_PROFILES_ACTIVE=prod in deployment
spring.profiles.active=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/busapp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:parola123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT ? override JWT_SECRET with a strong random key in production
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-in-prod!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

